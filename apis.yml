aid: cuein
name: Cuein
description: >-
  Cuein is an AI-native customer-experience platform ("co-pilot for customer experience
  teams") that unifies structured and unstructured customer-support data and applies
  generative AI to surface contact reasons, root causes, resolutions, and metrics such as
  Inferred CSAT and Resolution Rate. Its public developer surface exposes two REST APIs:
  an Insights API for retrieving per-conversation and bulk conversation insights over a
  date range, and an Answers API that generates answers grounded in a tenant's knowledge
  articles and documents. Both APIs use x-api-key authentication and are documented on a
  ReadMe-hosted developer hub. Cuein was acquired by ServiceNow (announced Q1 2025);
  the standalone developer hub remains live. Backed by Lightspeed Venture Partners.
