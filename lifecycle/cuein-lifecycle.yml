availability:
  summary: >-
    The documented API host no longer exists. Every OpenAPI Cuein publishes declares
    servers[] on api.cuein.ai, and that name is a dangling CNAME: it points at
    d-q6kmpx96lj.execute-api.us-west-2.amazonaws.com, an AWS API Gateway custom-domain
    target that has itself been deleted, so the record resolves to nothing and no
    request to the API can be made. The application host app.cuein.ai is dangling the
    same way, pointing at a CloudFront distribution (d1l3ciwqb9klkm.cloudfront.net)
    that no longer resolves. What remains live is the marketing site on HubSpot and
    the ReadMe-hosted developer hub, which still serves both OpenAPI definitions, its
    llms.txt, and an RFC 9727 API catalog describing an API that cannot be called.
  hosts:
  - host: api.cuein.ai
    role: API base host in every OpenAPI servers[]
    dns: CNAME -> d-q6kmpx96lj.execute-api.us-west-2.amazonaws.com
    resolves: false
    reachable: false
    error: 'curl: (6) Could not resolve host: api.cuein.ai'
    checked: '2026-08-14'
  - host: app.cuein.ai
    role: application / "Sign In" target linked from cuein.ai
    dns: CNAME -> d1l3ciwqb9klkm.cloudfront.net
    resolves: false
    reachable: false
    error: 'curl: (6) Could not resolve host: app.cuein.ai'
    checked: '2026-08-14'
  - host: status.cuein.ai
